<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Document Management System</title>
  <meta name="theme-color" content="#1e293b">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 6c1.4 0 2.5 1.1 2.5 2.5 0 .9-.5 1.7-1.2 2.1v3.4h-2.6v-3.4c-.7-.4-1.2-1.2-1.2-2.1 0-1.4 1.1-2.5 2.5-2.5z'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 6c1.4 0 2.5 1.1 2.5 2.5 0 .9-.5 1.7-1.2 2.1v3.4h-2.6v-3.4c-.7-.4-1.2-1.2-1.2-2.1 0-1.4 1.1-2.5 2.5-2.5z'/%3E%3C/svg%3E">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Document%20Vault%22,%22short_name%22:%22Vault%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#0f172a%22,%22theme_color%22:%22#1e293b%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%253Csvg%2520xmlns=%27http://www.w3.org/2000/svg%27%2520viewBox=%270%25200%252024%252024%27%2520fill=%27%25233b82f6%27%253E%253Cpath%2520d=%27M12%25201L3%25205v6c0%25205.55%25203.84%252010.74%25209%252012%25205.16-1.26%25209-5.45%25209-12V5l-9-4zm0%25206c1.4%25200%25202.5%25201.1%25202.5%25202.5%25200%2520.9-.5%25201.7-1.2%25202.1v3.4h-2.6v-3.4c-.7-.4-1.2-1.2-1.2-2.1%25200-1.4%25201.1-2.5%25202.5-2.5z%27/%253E%253C/svg%253E%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%20maskable%22}]}">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Top Navigation Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white shadow">DMS</div>
      <h1 class="text-xl font-semibold tracking-tight">Document Vault</h1>
    </div>
    <div class="text-xs text-slate-400" id="status-indicator">Loading database...</div>
  </header>

  <!-- Filter Controls & Search Bar -->
  <section class="bg-slate-800/50 border-b border-slate-700 p-4 px-6 flex flex-wrap gap-3 items-center">
    <input type="text" id="search-input" placeholder="Search documents..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 flex-1 min-w-[200px]">
    
    <select id="type-filter" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
      <option value="">All File Types</option>
    </select>

    <select id="year-filter" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
      <option value="">All Years</option>
    </select>

    <button id="clear-filters" class="text-xs text-slate-400 hover:text-white px-2 py-1">Reset View</button>
  </section>

  <!-- Split-Screen Workspace -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- Left Document / Folder Panel -->
    <div class="w-full lg:w-5/12 border-r border-slate-700 overflow-y-auto p-4 space-y-3 max-h-[50vh] lg:max-h-none flex flex-col" id="left-panel">
      <!-- Breadcrumb Navigation Bar -->
      <div id="breadcrumb-bar" class="hidden flex items-center justify-between pb-2 mb-2 border-b border-slate-700/60 text-xs">
        <button id="back-to-folders" class="flex items-center gap-1 text-blue-400 hover:text-blue-300 font-medium">
          ← Back to Vault Folders
        </button>
        <span id="current-folder-label" class="text-slate-400 font-mono"></span>
      </div>

      <div id="panel-list" class="space-y-2 flex-1">
        <div class="text-center py-12 text-slate-500 text-sm">Loading records...</div>
      </div>
    </div>

    <!-- Right PDF/File Viewer Panel -->
    <div class="w-full lg:w-7/12 bg-slate-950 flex flex-col min-h-[50vh] lg:min-h-0">
      <div id="viewer-header" class="p-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center hidden">
        <span id="viewer-title" class="text-xs font-medium text-slate-300 truncate pr-4">Document Title</span>
        <a id="external-link" href="#" target="_blank" class="text-xs text-blue-400 hover:underline flex items-center gap-1">Open in Drive ↗</a>
      </div>
      <div id="viewer-container" class="flex-1 flex items-center justify-center p-6 text-center">
        <div class="flex flex-col items-center justify-center text-slate-500 gap-3" id="viewer-placeholder">
          <svg class="w-16 h-16 opacity-40 stroke-current text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
          <span class="text-xs tracking-wider uppercase font-semibold text-slate-400" id="placeholder-text">SELECT A VAULT FOLDER TO BEGIN BROWSING DOCUMENTS</span>
        </div>
        <iframe id="preview-frame" class="w-full h-full rounded border-0 hidden" allow="autoplay"></iframe>
      </div>
    </div>

  </main>

  <script>
    // --- PASTE YOUR PUBLISHED CSV URL BELOW ---
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxgtQLPj7r29kV62-RvD3JOyShdRhuffM_OLcnE31uQrUrwDuMtpyXZArQbmegATSVnETHRaVMFW7d/pub?gid=0&single=true&output=csv";
    // ----------------------------------------

    let rawData = [];
    let activeFolder = null; // null = viewing root folders, string = viewing specific folder

    const panelList = document.getElementById("panel-list");
    const breadcrumbBar = document.getElementById("breadcrumb-bar");
    const backToFoldersBtn = document.getElementById("back-to-folders");
    const currentFolderLabel = document.getElementById("current-folder-label");
    const searchInput = document.getElementById("search-input");
    const typeFilter = document.getElementById("type-filter");
    const yearFilter = document.getElementById("year-filter");
    const clearFiltersBtn = document.getElementById("clear-filters");
    const statusIndicator = document.getElementById("status-indicator");
    const previewFrame = document.getElementById("preview-frame");
    const viewerPlaceholder = document.getElementById("viewer-placeholder");
    const placeholderText = document.getElementById("placeholder-text");
    const viewerHeader = document.getElementById("viewer-header");
    const viewerTitle = document.getElementById("viewer-title");
    const externalLink = document.getElementById("external-link");

    function init() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          rawData = results.data.filter(row => row.Name && row.FileID);
          statusIndicator.textContent = `${rawData.length} Documents Loaded`;
          populateDropdowns();
          renderView();
        },
        error: function(err) {
          statusIndicator.textContent = "Error loading database feed.";
          console.error(err);
        }
      });
    }

    function populateDropdowns() {
      const types = [...new Set(rawData.map(item => item.Type))].filter(Boolean).sort();
      const years = [...new Set(rawData.map(item => item.Year))].filter(Boolean).sort().reverse();

      typeFilter.innerHTML = '<option value="">All File Types</option>';
      years.innerHTML = '<option value="">All Years</option>';

      types.forEach(t => typeFilter.innerHTML += `<option value="${t}">${t}</option>`);
      years.forEach(y => yearFilter.innerHTML += `<option value="${y}">${y}</option>`);
    }

    function renderView() {
      const q = searchInput.value.trim().toLowerCase();
      const selectedType = typeFilter.value;
      const selectedYear = yearFilter.value;

      // If user types a search query or selects a dropdown filter, show matching documents across all folders
      if (q || selectedType || selectedYear) {
        breadcrumbBar.classList.remove("hidden");
        currentFolderLabel.textContent = q ? "Search Results" : "Filtered Documents";
        renderDocuments(getFilteredData());
        return;
      }

      // If no folder selected, render Root Vault Folders (Andiku, SAB, TDK)
      if (!activeFolder) {
        breadcrumbBar.classList.add("hidden");
        renderFolders();
      } else {
        breadcrumbBar.classList.remove("hidden");
        currentFolderLabel.textContent = `Folder: ${activeFolder}`;
        const folderDocs = rawData.filter(item => item.Category === activeFolder);
        renderDocuments(folderDocs);
      }
    }

    function renderFolders() {
      panelList.innerHTML = "";
      const categories = [...new Set(rawData.map(item => item.Category))].filter(Boolean).sort();

      if (categories.length === 0) {
        panelList.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm">No vault folders found</div>';
        return;
      }

      categories.forEach(cat => {
        const docCount = rawData.filter(item => item.Category === cat).length;
        const card = document.createElement("div");
        card.className = "p-4 bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700 rounded-xl cursor-pointer transition flex justify-between items-center group shadow-sm";
        
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="p-2 bg-slate-900 border border-slate-700 rounded-lg text-amber-400 group-hover:border-amber-400/50 transition">
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
              </svg>
            </div>
            <div>
              <h3 class="text-base font-semibold text-slate-100 group-hover:text-blue-400 transition">${cat}</h3>
              <p class="text-xs text-slate-400 mt-0.5">Root Vault Folder • ${docCount} ${docCount === 1 ? 'file' : 'files'}</p>
            </div>
          </div>
          <span class="text-[10px] px-2.5 py-1 rounded-md font-mono bg-amber-950/60 text-amber-400 border border-amber-700/50 uppercase tracking-wider">Folder</span>
        `;

        card.addEventListener("click", () => {
          activeFolder = cat;
          placeholderText.textContent = `SELECT A DOCUMENT IN ${cat.toUpperCase()} TO BEGIN PREVIEW`;
          renderView();
        });

        panelList.appendChild(card);
      });
    }

    function renderDocuments(items) {
      panelList.innerHTML = "";
      if (items.length === 0) {
        panelList.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm">No matching documents found</div>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 rounded-lg cursor-pointer transition flex justify-between items-start gap-3";
        
        let typeBadgeColor = "bg-gray-700 text-gray-300";
        if (item.Type === "PDF") typeBadgeColor = "bg-red-900/60 text-red-300 border border-red-700/50";
        if (item.Type === "Sheet") typeBadgeColor = "bg-emerald-900/60 text-emerald-300 border border-emerald-700/50";
        if (item.Type === "Doc") typeBadgeColor = "bg-blue-900/60 text-blue-300 border border-blue-700/50";
        if (item.Type === "Image") typeBadgeColor = "bg-purple-900/60 text-purple-300 border border-purple-700/50";

        card.innerHTML = `
          <div class="overflow-hidden">
            <h3 class="text-sm font-medium text-slate-100 truncate">${item.Name}</h3>
            <div class="flex items-center gap-2 mt-1 text-xs text-slate-400">
              <span>${item.Category || "Root"}</span>
              <span>•</span>
              <span>${item.LastModified || ""}</span>
            </div>
          </div>
          <span class="text-[10px] px-2 py-0.5 rounded font-mono ${typeBadgeColor}">${item.Type}</span>
        `;

        card.addEventListener("click", () => loadPreview(item));
        panelList.appendChild(card);
      });
    }

    function getFilteredData() {
      const q = searchInput.value.toLowerCase();
      const selectedType = typeFilter.value;
      const selectedYear = yearFilter.value;

      return rawData.filter(item => {
        const matchesQuery = item.Name.toLowerCase().includes(q) || (item.Category && item.Category.toLowerCase().includes(q));
        const matchesType = !selectedType || item.Type === selectedType;
        const matchesYear = !selectedYear || item.Year === selectedYear;
        const matchesFolder = !activeFolder || item.Category === activeFolder || q || selectedType || selectedYear;
        return matchesQuery && matchesType && matchesYear && matchesFolder;
      });
    }

    function loadPreview(item) {
      const previewUrl = `https://drive.google.com/file/d/${item.FileID}/preview`;
      previewFrame.src = previewUrl;
      previewFrame.classList.remove("hidden");
      viewerPlaceholder.classList.add("hidden");
      viewerHeader.classList.remove("hidden");
      viewerTitle.textContent = item.Name;
      externalLink.href = item.URL;
    }

    function resetToRootFolders() {
      activeFolder = null;
      searchInput.value = "";
      typeFilter.value = "";
      yearFilter.value = "";
      previewFrame.src = "";
      previewFrame.classList.add("hidden");
      viewerHeader.classList.add("hidden");
      viewerPlaceholder.classList.remove("hidden");
      placeholderText.textContent = "SELECT A VAULT FOLDER TO BEGIN BROWSING DOCUMENTS";
      renderView();
    }

    backToFoldersBtn.addEventListener("click", resetToRootFolders);
    clearFiltersBtn.addEventListener("click", resetToRootFolders);
    searchInput.addEventListener("input", renderView);
    typeFilter.addEventListener("change", renderView);
    yearFilter.addEventListener("change", renderView);

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
